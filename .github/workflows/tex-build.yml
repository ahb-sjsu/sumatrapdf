name: TeX engine build
on:
  push:
    branches: [feat/tex-engine]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Release x64 + unit tests
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build release
        run: bun .\cmd\build.ts -release

      - name: Unit tests
        run: bun .\cmd\run-unit-tests.ts -rel

      - name: Upload SumatraPDF.exe
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SumatraPDF-tex-rel64
          path: |
            out/rel64/*.exe
            out/rel64/*.dll
            out/rel64/unit-tests-*.txt
          if-no-files-found: error
